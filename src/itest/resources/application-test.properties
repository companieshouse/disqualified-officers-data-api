# Test-specific properties for integration and Cucumber tests
spring.data.mongodb.database=disqualified-officers-test
disqualified.officers.api.base-url=http://localhost:8080
spring.mongodb.uri=${MONGODB_URL}

# TODO: ASM-1930 Remove this exclusion once OpenTelemetry is properly configured for SB4.
# The structured-logging library pulls in OTel transitively which causes auto-configuration
# condition evaluation errors in the test context.
spring.autoconfigure.exclude=io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration